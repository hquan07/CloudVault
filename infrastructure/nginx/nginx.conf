worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500m;
    server_tokens off;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=auth_login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_register_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=share_access_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    # Upstream definitions
    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth-service:8000;
    }

    upstream file_service {
        server file-service:8000;
    }

    upstream metadata_service {
        server metadata-service:8000;
    }

    include /etc/nginx/conf.d/*.conf;
}
