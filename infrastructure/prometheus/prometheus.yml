# CloudVault — Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:8000']

  - job_name: 'file-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['file-service:8000']

  - job_name: 'metadata-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['metadata-service:8000']

  - job_name: 'project-operations'
    metrics_path: /metrics
    static_configs:
      - targets: ['project-operations:9100']
